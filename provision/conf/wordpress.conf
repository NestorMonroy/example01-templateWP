<VirtualHost *:80>
    DocumentRoot /vagrant/htdocs/wordpress
    <Directory /vagrant/htdocs/wordpress>
        Options FollowSymLinks
        AllowOverride Limit Options FileInfo
        DirectoryIndex index.php
        Require all granted
    </Directory>
    <Directory /vagrant/htdocs/wp-content>
        Options FollowSymLinks
        Require all granted
    </Directory>
</VirtualHost>